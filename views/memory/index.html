<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>微信群长期记忆</title><link rel="stylesheet" href="./style.css?v=0.5.0-alpha.4"></head>
<body><main><header><p class="eyebrow">WECHAT MEMORY / 新内核预览</p><h1>群聊长期记忆</h1><p>从原文到记忆，每一项都能找到来源。</p><div class="toolbar"><select id="scope" aria-label="当前微信群"></select><button id="refresh">刷新群名与成员姓名</button></div></header>

<dialog id="detail"><button id="close-detail">关闭</button><div id="detail-body"></div></dialog>
<footer>预览版 · 媒体只归档元数据，尚不解析；向量检索已移除。画像退出与原文归档独立，备份不随在线删除清除。</footer></main><script type="module" src="./app.js?v=0.5.0-alpha.4"></script></body></html>
